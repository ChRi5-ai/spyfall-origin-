<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spyfall 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    Phase 1 scope: render a static placeholder map on a canvas.
    No UI overlays (lobby/reveal/discussion/etc.) exist yet — those
    arrive in a later phase per the roadmap, layered on top of this
    canvas rather than replacing it.
  -->
  <div id="game-root">
    <canvas id="game-canvas" width="800" height="600"></canvas>
  </div>

  <!-- Socket.io client, served automatically by the socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <!--
    Load order matters for the module graph: canvas.js imports from
    network.js, which imports from input.js. Using type="module" means
    the browser resolves those imports automatically, so only the
    entry point (canvas.js) needs to be listed here.
  -->
  <script type="module" src="canvas.js"></script>
</body>
</html>
