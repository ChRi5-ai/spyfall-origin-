<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spyfall 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    PHASE 4: entry screen shown before joining a party. Hidden once a
    'lobby' event arrives from the server (see lobby.js).
  -->
  <div id="lobby-entry" class="panel">
    <h1>Spyfall 2D</h1>
    <button id="create-room-btn">Create Room</button>
    <div class="divider">or</div>
    <input id="join-code-input" maxlength="6" placeholder="ROOM CODE" autocomplete="off" />
    <button id="join-room-btn">Join Room</button>
    <p id="lobby-error" class="error"></p>
  </div>

  <!--
    Room info overlay, shown once inside a party. No game settings or
    ready button yet — just who's here and who's host.
  -->
  <div id="room-info" class="panel hidden">
    <h2>Room <span id="room-code-display"></span></h2>
    <p id="host-indicator"></p>
    <p id="player-count"></p>
    <ul id="player-list"></ul>
    <!--
      Host-only. Visibility and enabled state are both driven entirely
      by data the server sent in the 'lobby' snapshot (see lobby.js) —
      never decided client-side. Not wired to an actual game start yet.
    -->
    <button id="start-game-btn" class="hidden" disabled>Start Game</button>
    <p id="start-message" class="hidden error"></p>
  </div>

  <!--
    Character selection grid — 10 fixed slots, always shown once in a
    room. No Start Game control here; that's a separate, later step.
  -->
  <div id="character-panel" class="panel hidden">
    <h2>Choose a Character</h2>
    <div id="character-grid"></div>
  </div>

  <!--
    PHASE 6: host-configurable match settings. Read-only for
    non-host players — buttons render disabled for them (see
    settings.js), the server enforces the same restriction regardless.
  -->
  <div id="settings-panel" class="panel hidden">
    <h2>Match Settings</h2>
    <p class="settings-label">Map</p>
    <div id="map-options" class="settings-options"></div>
    <p class="settings-label">Discussion Timer</p>
    <div id="timer-options" class="settings-options"></div>
    <p id="settings-error" class="error"></p>
  </div>

  <!--
    PHASE 6: shown once the host successfully starts the game.
    PHASE 7: now also displays this client's own role (never anyone
    else's — see role-reveal.js) and a live discussion countdown
    (see timer.js, which takes over #gameplay-timer's text once the
    timer starts).
  -->
  <div id="gameplay-panel" class="panel hidden">
    <h2 id="role-title"></h2>
    <p id="role-detail" class="role-detail"></p>
    <p>Map: <span id="gameplay-map"></span></p>
    <p>Time Remaining: <span id="gameplay-timer"></span></p>
  </div>

  <!--
    PHASE 9A: Call Vote button, visible during discussion. Its own
    visibility is toggled by conference.js once voting actually
    starts — the button itself never decides eligibility, the server
    does (see server/vote-request.js).
  -->
  <button id="call-vote-btn" type="button" class="hidden call-vote-btn">Call Vote</button>

  <!--
    PHASE 9A: accept/decline prompt shown to everyone except the
    caller when a vote is requested.
  -->
  <div id="vote-request-prompt" class="panel vote-request-prompt hidden">
    <p id="vote-request-text"></p>
    <button id="vote-request-accept" type="button">Accept</button>
    <button id="vote-request-decline" type="button">Decline</button>
  </div>
  <p id="vote-request-status" class="vote-request-status"></p>

  <!--
    PHASE 9A: conference room — placeholder circular layout, no final
    artwork. Movement is disabled entirely server-side while this is
    active; nothing here needs to touch input.js.
  -->
  <div id="conference-panel" class="panel conference-panel hidden">
    <h2>Conference Room</h2>
    <div id="conference-table" class="conference-table"></div>
    <p id="conference-status" class="conference-status"></p>
  </div>

  <!-- PHASE 9B: public elimination reveal — same for every player. -->
  <div id="elimination-panel" class="panel hidden">
    <h2>Elimination</h2>
    <p id="elimination-text"></p>
  </div>

  <!--
    PHASE 9B: only ever shown to the actual eliminated spy — the
    server sends 'spyGuessPrompt' privately to that one socket.
  -->
  <div id="spy-guess-panel" class="panel hidden">
    <h2>Guess the Location</h2>
    <div id="spy-guess-options" class="spy-guess-options"></div>
    <p id="spy-guess-status" class="spy-guess-status"></p>
  </div>

  <!-- PHASE 9B: results screen — public to everyone once the match ends. -->
  <div id="results-panel" class="panel results-panel hidden">
    <h2>Results</h2>
    <p id="results-winner" class="results-winner"></p>
    <p>Spy: <span id="results-spy"></span></p>
    <p>Correct Location: <span id="results-location"></span></p>
    <ul id="results-players"></ul>
    <button id="play-again-btn" type="button">Play Again</button>
    <button id="return-to-lobby-btn" type="button">Return to Lobby</button>
    <p id="results-error" class="error"></p>
  </div>

  <!--
    PHASE 8: interaction prompt, shown when standing near another
    player. Purely a client-side hint — the server independently
    re-validates distance on every actual request (see proximity.js).
  -->
  <p id="interaction-prompt" class="interaction-prompt hidden"></p>
  <div id="interaction-chooser" class="panel interaction-chooser hidden"></div>

  <!--
    PHASE 8: the private question/answer panel. Only ever populated
    with data the server sent to this client specifically — see
    conversation.js.
  -->
  <div id="conversation-panel" class="panel conversation-panel hidden">
    <h2>Questioning <span id="conversation-other-name"></span></h2>
    <p id="conversation-question-display"></p>
    <p id="conversation-waiting" class="hidden"></p>
    <div id="conversation-question-input-wrap" class="hidden">
      <input id="conversation-question-input" type="text" maxlength="200" placeholder="Type your question..." />
      <button id="conversation-question-send" type="button">Ask</button>
    </div>
    <div id="conversation-answer-input-wrap" class="hidden">
      <input id="conversation-answer-input" type="text" maxlength="200" placeholder="Type your answer..." />
      <button id="conversation-answer-send" type="button">Answer</button>
    </div>
    <p id="conversation-error" class="error"></p>
  </div>

  <!--
    PHASE 8: collapsible Investigation Log — only ever shows
    conversations this client participated in (see investigation-log.js).
  -->
  <div id="investigation-log-container" class="investigation-log-container">
    <button id="investigation-log-toggle" type="button">Investigation Log</button>
    <div id="investigation-log-panel" class="panel hidden">
      <ul id="investigation-log-list"></ul>
    </div>
  </div>

  <!--
    The movement canvas itself, hidden until a room is joined. Once
    visible, world.js/canvas.js render exactly as they did in Phase 3
    — the only change is that the player roster they receive is now
    scoped to this client's room instead of one global shared world.
  -->
  <div id="game-root" class="hidden">
    <canvas id="game-canvas" width="800" height="600"></canvas>
  </div>

  <!-- Socket.io client, served automatically by the socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <!--
    lobby.js and canvas.js are two independent entry points sharing
    one socket connection (socket.js) under the hood. Using
    type="module" means the browser resolves each file's own imports
    automatically.
  -->
  <script type="module" src="lobby.js"></script>
  <script type="module" src="characters.js"></script>
  <script type="module" src="settings.js"></script>
  <script type="module" src="game-start.js"></script>
  <script type="module" src="role-reveal.js"></script>
  <script type="module" src="timer.js"></script>
  <script type="module" src="proximity.js"></script>
  <script type="module" src="conversation.js"></script>
  <script type="module" src="investigation-log.js"></script>
  <script type="module" src="vote-request.js"></script>
  <script type="module" src="conference.js"></script>
  <script type="module" src="elimination.js"></script>
  <script type="module" src="spy-guess.js"></script>
  <script type="module" src="results.js"></script>
  <script type="module" src="canvas.js"></script>
</body>
</html>
