<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spyfall 2D</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    PHASE 4: entry screen shown before joining a party. Hidden once a
    'lobby' event arrives from the server (see lobby.js).
  -->
  <div id="lobby-entry" class="panel">
    <h1>Spyfall 2D</h1>
    <button id="create-room-btn">Create Room</button>
    <div class="divider">or</div>
    <input id="join-code-input" maxlength="6" placeholder="ROOM CODE" autocomplete="off" />
    <button id="join-room-btn">Join Room</button>
    <p id="lobby-error" class="error"></p>
  </div>

  <!--
    Room info overlay, shown once inside a party. No game settings or
    ready button yet — just who's here and who's host.
  -->
  <div id="room-info" class="panel hidden">
    <h2>Room <span id="room-code-display"></span></h2>
    <p id="host-indicator"></p>
    <p id="player-count"></p>
    <ul id="player-list"></ul>
    <!--
      Host-only. Visibility and enabled state are both driven entirely
      by data the server sent in the 'lobby' snapshot (see lobby.js) —
      never decided client-side. Not wired to an actual game start yet.
    -->
    <button id="start-game-btn" class="hidden" disabled>Start Game</button>
    <p id="start-message" class="hidden error"></p>
  </div>

  <!--
    Character selection grid — 10 fixed slots, always shown once in a
    room. No Start Game control here; that's a separate, later step.
  -->
  <div id="character-panel" class="panel hidden">
    <h2>Choose a Character</h2>
    <div id="character-grid"></div>
  </div>

  <!--
    The movement canvas itself, hidden until a room is joined. Once
    visible, world.js/canvas.js render exactly as they did in Phase 3
    — the only change is that the player roster they receive is now
    scoped to this client's room instead of one global shared world.
  -->
  <div id="game-root" class="hidden">
    <canvas id="game-canvas" width="800" height="600"></canvas>
  </div>

  <!-- Socket.io client, served automatically by the socket.io server -->
  <script src="/socket.io/socket.io.js"></script>

  <!--
    lobby.js and canvas.js are two independent entry points sharing
    one socket connection (socket.js) under the hood. Using
    type="module" means the browser resolves each file's own imports
    automatically.
  -->
  <script type="module" src="lobby.js"></script>
  <script type="module" src="characters.js"></script>
  <script type="module" src="canvas.js"></script>
</body>
</html>
